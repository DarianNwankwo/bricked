name: nextjs-app
region: nyc
services:
  - name: next-js-app
    git:
      repo: https://github.com/your-org/your-repo
      branch: main
    environment_slug: node-js
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: POSTGRESQL_URL
        value: ${postgresql.DATABASE_URL}
databases:
  - name: postgresql
    engine: PG
    version: "16"
    size: db-s-dev-database
